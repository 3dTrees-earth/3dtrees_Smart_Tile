[package]
name = "smarttile-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional native voxel reducer for SmartTile tiling"

[lib]
name = "smarttile_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = { version = "0.29", optional = true }
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }

[features]
# Without `python`, `cargo test` checks the reducer without an interpreter.
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
